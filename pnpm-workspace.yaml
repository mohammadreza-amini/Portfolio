# ============================================================
# pnpm-workspace.yaml — تنظیمات pnpm برای این پروژه
# (از pnpm 10 به بعد، تنظیمات pnpm در این فایل قرار می‌گیره
#  نه داخل package.json)
# ============================================================

# مجوز اجرای اسکریپت‌های نصب (postinstall) برای پکیج‌ها:
# esbuild برای نصب باینری بومی خودش به postinstall نیاز داره
# (با دستور `pnpm approve-builds esbuild` ثبت شده)
allowBuilds:
  esbuild: true
